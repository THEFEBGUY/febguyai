# Render Blueprint for the FebGuyAI backend.
# Production must use plain Uvicorn; backend/dev_server.py is local-only because it enables reload.
services:
  - type: web
    name: febguyai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: FEBGUY_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_PROVIDER
        value: postgres
      - key: POSTGRES_CONNECT_TIMEOUT
        value: "5"
      - key: POSTGRES_STATEMENT_TIMEOUT_MS
        value: "5000"
      - key: POSTGRES_LOCK_TIMEOUT_MS
        value: "3000"
      - key: POSTGRES_POOL_MAX_SIZE
        value: "8"
      - key: POSTGRES_POOL_TIMEOUT
        value: "5"
      - key: DATABASE_HEALTH_CACHE_SECONDS
        value: "15"
      - key: SLOW_ENDPOINT_LOG_MS
        value: "2000"
      # Local file artifacts use this path until the next phase moves durable storage to Supabase Storage.
      - key: FEBGUY_DATA_DIR
        value: /var/data/febguy
      - key: API_PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: ILOVEPDF_PUBLIC_KEY
        sync: false
      - key: ILOVEPDF_SECRET_KEY
        sync: false
